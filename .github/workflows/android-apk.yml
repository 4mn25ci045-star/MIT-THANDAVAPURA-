
name: Build MIT Thandavapura APK

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract project ZIP
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q mit-transit-gps-platform.zip -d extracted
          PROJECT_DIR="$(dirname "$(find extracted -name package.json -not -path '*/node_modules/*' -print -quit)")"
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "extracted" ]; then
            echo "ERROR: Could not find the app package.json in the ZIP."
            find extracted -maxdepth 4 -type f | head -80
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project folder: $PROJECT_DIR"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build web app
        run: npm run build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare Android project
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MIT-Thandavapura-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
