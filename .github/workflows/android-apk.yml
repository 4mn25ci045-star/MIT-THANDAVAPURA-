
name: Build MIT Thandavapura APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download project ZIP
        run: |
          curl -fL \
            https://raw.githubusercontent.com/4mn25ci045-star/MIT-THANDAVAPURA-/main/mit-transit-gps-platform.zip \
            -o project.zip

      - name: Extract project
        run: |
          unzip -q project.zip
          cd mit-transit-gps-platform
          npm ci

      - name: Build web app
        run: |
          cd mit-transit-gps-platform
          npm run build

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Capacitor
        run: |
          cd mit-transit-gps-platform
          npx cap sync android

      - name: Build debug APK
        run: |
          cd mit-transit-gps-platform/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MIT-Thandavapura-APK
          path: mit-transit-gps-platform/android/app/build/outputs/apk/debug/app-debug.apk
