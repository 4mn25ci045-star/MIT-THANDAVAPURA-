
name: Build MIT Thandavapura APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract project ZIP
        run: |
          unzip -q mit-transit-gps-platform.zip -d extracted
          find extracted -maxdepth 4 -name package.json

      - name: Install dependencies
        run: |
  npm install --package-lock=false --legacy-peer-deps --no-audit --no-fund

      - name: Build web app
        run: npm run build
        working-directory: extracted/mit-transit-gps-platform

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: extracted/mit-transit-gps-platform

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: extracted/mit-transit-gps-platform/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MIT-Thandavapura-APK
          path: extracted/mit-transit-gps-platform/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
