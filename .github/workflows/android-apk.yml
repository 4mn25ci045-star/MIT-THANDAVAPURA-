name: Build MIT Thandavapura APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mit-transit-gps-platform/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mit-transit-gps-platform
        run: npm ci

      - name: Build web app
        working-directory: mit-transit-gps-platform
        run: npm run build

      - name: Sync Capacitor
        working-directory: mit-transit-gps-platform
        run: npx cap sync android

      - name: Build APK
        working-directory: mit-transit-gps-platform/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MIT-Thandavapura-APK
          path: mit-transit-gps-platform/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
